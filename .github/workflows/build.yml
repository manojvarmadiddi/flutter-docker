name: build

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (e.g. 3.44.0) or 'stable'"
        required: true
        default: stable
      push:
        description: "Push images to GHCR"
        type: boolean
        default: true
  workflow_call:
    inputs:
      flutter_version: { type: string, required: true }
      push:            { type: boolean, default: true }

concurrency:
  group: build-${{ inputs.flutter_version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          source scripts/lib.sh
          echo "version=$(resolve_version '${{ inputs.flutter_version }}')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          args=(--version '${{ needs.prepare.outputs.version }}' --image "ghcr.io/${owner}/flutter")
          [[ '${{ inputs.push }}' == 'true' ]] && args+=(--push)
          ./scripts/build.sh "${args[@]}"
